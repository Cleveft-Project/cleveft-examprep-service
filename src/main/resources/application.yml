server:
  port: ${SERVER_PORT:8085}
  address: 0.0.0.0

spring:
  application:
    name: cleveft-examprep-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cleveft}?currentSchema=exam_prep,public
    username: ${DB_USERNAME:cleveft_user}
    password: ${DB_PASSWORD:cleveft_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Schema is owned by cleveft-infra/init.sql.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: exam_prep
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

cleveft:
  transcription-service:
    url: ${TRANSCRIPTION_SERVICE_URL:http://localhost:8082}
    timeout-ms: 30000
  query-service:
    url: ${QUERY_SERVICE_URL:http://localhost:8081}
    timeout-ms: 10000

  gemini:
    api-key: ${GOOGLE_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    timeout-ms: 120000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.cleveft.examprepservice: ${LOG_LEVEL:INFO}
